name: Custom.Windows.Applications.AIBrowsers
author: Saksham Tushar - c0c0n 2026 "The AI Browser Blind Spot"
description: |
  Triage AI-native browsers and AI browser agents that standard Chromium
  artifacts miss: Perplexity Comet (prompt cache, bundled agent extensions,
  updater log), Brave Leo (local AIChat SQLite + plaintext memories), Gemini in
  Chrome (`glic` storage partition), agent extensions (Claude in Chrome, ChatGPT,
  Comet) and their native-messaging bridges, plus History visits whose
  transition carries FROM_API (0x08000000), which in our lab marked extension-
  agent and CDP-driven navigation. Enumerates presence and optionally uploads
  the high-value AI artifacts. Read-only.
type: CLIENT
parameters:
  - name: UploadArtifacts
    type: bool
    description: Also upload the AI-layer files (prompt cache, AIChat, extension stores, History, Web Data, Sessions, glic partition, updater log, native-messaging manifests).
  - name: UserDataGlobs
    type: csv
    default: |
      Glob
      C:/Users/*/AppData/Local/Perplexity/Comet/User Data
      C:/Users/*/AppData/Local/BraveSoftware/Brave-Browser/User Data
      C:/Users/*/AppData/Local/Google/Chrome/User Data
      C:/Users/*/AppData/Local/Microsoft/Edge/User Data
  - name: AIExtensionIds
    type: csv
    description: Extension IDs of AI agents and bundled AI extensions.
    default: |
      Id,Name
      fcoeoabgfenejglbffodgkkbkcdhcgfn,Claude in Chrome
      hehggadaopoacecdllhhajmbjkdcmajg,ChatGPT (OpenAI)
      mcjlamohcooanphmebaiigheeeoplihb,Comet assistant (bundled)
      npclhjbddhklpbnacpjloidibaggcgon,comet-agent (bundled)
      mjdcklhepheaaemphcopihnmjlmjpcnh,Comet Web Resources (bundled)

sources:
  - name: InstalledAIBrowsers
    query: |
      SELECT OSPath, Mtime, Size
      FROM glob(globs=UserDataGlobs.Glob)

  - name: CometUpdaterLog
    query: |
      SELECT OSPath, Mtime, Size
      FROM glob(globs="C:/Program Files (x86)/Perplexity/CometUpdater/updater_history.jsonl")

  - name: CometPromptCache
    description: Comet assistant chat prompts and thread IDs are cached here (IndexedDB, perplexity.ai origin).
    query: |
      SELECT OSPath, Mtime, Size
      FROM glob(globs="C:/Users/*/AppData/Local/Perplexity/Comet/User Data/*/IndexedDB/https_www.perplexity.ai_0.indexeddb.leveldb/*")

  - name: BraveLeoAIChat
    query: |
      SELECT OSPath, Mtime, Size
      FROM glob(globs="C:/Users/*/AppData/Local/BraveSoftware/Brave-Browser/User Data/*/AIChat")

  - name: BraveLeoMemories
    query: |
      SELECT OSPath,
             parse_json(data=read_file(filename=OSPath)).brave.ai_chat.user_memories AS Memories
      FROM glob(globs="C:/Users/*/AppData/Local/BraveSoftware/Brave-Browser/User Data/*/Preferences")

  - name: AIExtensionsInstalled
    description: AI extensions on disk, including Comet's three bundled ones (Secure Preferences may wrongly say from_webstore=true).
    query: |
      SELECT OSPath, Mtime,
             basename(path=OSPath) AS ExtensionId,
             { SELECT Name FROM AIExtensionIds WHERE Id = basename(path=OSPath) } AS Extension
      FROM glob(globs="C:/Users/*/AppData/Local/*/*/User Data/*/Extensions/*")
      WHERE basename(path=OSPath) IN AIExtensionIds.Id

  - name: AIExtensionStores
    description: chrome.storage.local LevelDB of each AI extension (Claude permissionStorage, ChatGPT NATIVE_HOST_STATUS heartbeat).
    query: |
      SELECT OSPath, Mtime, Size,
             basename(path=dirname(path=OSPath)) AS ExtensionId
      FROM glob(globs="C:/Users/*/AppData/Local/*/*/User Data/*/Local Extension Settings/*/*")
      WHERE basename(path=dirname(path=OSPath)) IN AIExtensionIds.Id

  - name: GeminiGlicPartition
    query: |
      SELECT OSPath, Mtime, Size
      FROM glob(globs="C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Storage/ext/glic/**")

  - name: NativeMessagingHosts
    description: On Windows the browser finds native-messaging hosts through the registry; each key's default value is the manifest path.
    query: |
      LET hosts = SELECT OSPath AS RegistryValue, Data.value AS Manifest
        FROM glob(accessor="registry", globs=[
          "HKEY_USERS/*/Software/Google/Chrome/NativeMessagingHosts/*/@",
          "HKEY_USERS/*/Software/BraveSoftware/Brave-Browser/NativeMessagingHosts/*/@",
          "HKEY_USERS/*/Software/Microsoft/Edge/NativeMessagingHosts/*/@",
          "HKEY_USERS/*/Software/Perplexity/Comet/NativeMessagingHosts/*/@",
          "HKEY_LOCAL_MACHINE/SOFTWARE/Google/Chrome/NativeMessagingHosts/*/@",
          "HKEY_LOCAL_MACHINE/SOFTWARE/WOW6432Node/Google/Chrome/NativeMessagingHosts/*/@"])
      SELECT RegistryValue, Manifest,
             parse_json(data=read_file(filename=Manifest)).name AS HostName,
             parse_json(data=read_file(filename=Manifest)).path AS BridgeBinary,
             parse_json(data=read_file(filename=Manifest)).allowed_origins AS AllowedExtensions
      FROM hosts

  - name: HistoryFromApiVisits
    description: |
      Visits whose transition carries FROM_API (0x08000000). In our lab this marked
      Claude in Chrome's agent navigation and CDP/Playwright automation, but not a
      person typing or a link handed over by another app. Chromium defines the bit
      as "originated from an external application; embedder dependent".
    query: |
      LET histories = SELECT OSPath FROM glob(globs="C:/Users/*/AppData/Local/*/*/User Data/*/History")
      SELECT * FROM foreach(row=histories, query={
        SELECT OSPath AS HistoryFile,
               timestamp(winfiletime=visit_time * 10) AS VisitTime,
               Url, Title,
               format(format="0x%08X", args=transition) AS Transition
        FROM sqlite(file=OSPath, query="SELECT v.visit_time, u.url AS Url, u.title AS Title, v.transition FROM visits v JOIN urls u ON u.id = v.url WHERE (v.transition & 134217728) != 0 ORDER BY v.visit_time")
      })

  - name: Uploads
    query: |
      SELECT upload(file=OSPath) AS Upload FROM foreach(row={
        SELECT OSPath FROM glob(globs=[
          "C:/Users/*/AppData/Local/*/*/User Data/Local State",
          "C:/Users/*/AppData/Local/*/*/User Data/*/Preferences",
          "C:/Users/*/AppData/Local/*/*/User Data/*/Secure Preferences",
          "C:/Users/*/AppData/Local/*/*/User Data/*/History",
          "C:/Users/*/AppData/Local/*/*/User Data/*/Web Data",
          "C:/Users/*/AppData/Local/*/*/User Data/*/Sessions/*",
          "C:/Users/*/AppData/Local/*/*/User Data/*/AIChat",
          "C:/Users/*/AppData/Local/Perplexity/Comet/User Data/*/IndexedDB/https_www.perplexity.ai_0.indexeddb.leveldb/*",
          "C:/Users/*/AppData/Local/*/*/User Data/*/Local Extension Settings/{fcoeoabgfenejglbffodgkkbkcdhcgfn,hehggadaopoacecdllhhajmbjkdcmajg,mcjlamohcooanphmebaiigheeeoplihb,npclhjbddhklpbnacpjloidibaggcgon,mjdcklhepheaaemphcopihnmjlmjpcnh}/*",
          "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Storage/ext/glic/**",
          "C:/Program Files (x86)/Perplexity/CometUpdater/updater_history.jsonl"])
      }) WHERE UploadArtifacts
